name: Fetch News and Deploy

on:
  workflow_dispatch:       # Manual trigger
  schedule:                # Weekly auto-update (Monday 8:00 UTC = 16:00 CST)
    - cron: '0 8 * * 1'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch RSS news
        run: node scripts/fetch-news.mjs

      - name: Fetch GitHub trending
        run: node scripts/fetch-trending.mjs

      - name: Commit and push updated news data
        run: |
          git config user.name "ai-news-hub-bot"
          git config user.email "bot@ai-news-hub.local"
          git add src/data/news.json
          if git diff --cached --quiet; then
            echo "No changes to news data"
          else
            git commit -m "chore: auto-update news data"
            git push
          fi

      - name: Build site
        run: npx astro build

      - name: Build search index
        run: npx pagefind --site dist

      - name: Create Cloudflare Pages project (if not exists)
        run: |
          npx wrangler@3 pages project create ai-news-hub --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=ai-news-hub
