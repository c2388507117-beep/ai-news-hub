name: Fetch News and Deploy

on:
  push:
    branches: [main]       # Push to main triggers deploy
  workflow_dispatch:       # Manual trigger
  schedule:                # Hourly auto-update
    - cron: '17 * * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch RSS news
        run: node scripts/fetch-news.mjs

      - name: Fetch wallpapers
        run: node scripts/fetch-wallpapers.mjs

      - name: Fetch football data
        run: node scripts/fetch-football.mjs

      - name: Fetch Steam charts
        run: node scripts/fetch-steam.mjs

      - name: Fetch Bilibili favorites
        run: node scripts/fetch-bilibili.mjs

      - name: Fetch daily knowledge
        run: node scripts/fetch-knowledge.mjs

      - name: Fetch daily digest
        run: node scripts/fetch-digest.mjs

      - name: Fetch hot topics
        run: node scripts/fetch-hot-topics.mjs || true

      - name: Fetch GitHub trending repos
        run: node scripts/fetch-trending.mjs || true

      - name: Fetch AI leaderboard
        run: node scripts/fetch-leaderboard.mjs || true

      - name: Commit and push updated data
        run: |
          git config user.name "ai-news-hub-bot"
          git config user.email "bot@ai-news-hub.local"
          git add src/data/news.json src/data/wallpapers.json src/data/wallpapers-girl.json src/data/football.json src/data/steam.json src/data/bilibili.json src/data/knowledge.json src/data/digest.json src/data/hot-topics.json src/data/leaderboard.json
          if git diff --cached --quiet; then
            echo "No changes to data files"
          else
            git commit -m "chore: auto-update news and leaderboard data"
            git push
          fi

      - name: Apply D1 database migration
        run: npx wrangler@3 d1 execute ai-news-hub-db --file=migrations/0001_initial.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build site
        run: npx astro build

      - name: Build search index
        run: npx pagefind --site dist

      - name: Create Cloudflare Pages project (if not exists)
        run: |
          npx wrangler@3 pages project create ai-news-hub --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=ai-news-hub
