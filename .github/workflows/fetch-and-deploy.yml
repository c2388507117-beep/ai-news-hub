name: Fetch News and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      - name: Fetch game deals
        run: node scripts/fetch-game-deals.mjs || true

      - name: Fetch wallpapers
        run: node scripts/fetch-wallpapers.mjs

      - name: Fetch football data
        run: node scripts/fetch-football.mjs

      - name: Fetch daily knowledge
        run: node scripts/fetch-knowledge.mjs

      - name: Fetch daily digest
        run: node scripts/fetch-digest.mjs

      - name: Fetch today in history
        run: node scripts/fetch-today-history.mjs || true

      - name: Commit and push updated data
        run: |
          git config user.name "ai-news-hub-bot"
          git config user.email "bot@ai-news-hub.local"
          git add src/data/wallpapers.json src/data/wallpapers-girl.json src/data/football.json src/data/knowledge.json src/data/digest.json src/data/today-history.json src/data/game-deals.json
          if git diff --cached --quiet; then
            echo "No changes to data files"
          else
            git commit -m "chore: auto-update data files"
            git push
          fi

      - name: Apply D1 database migration
        run: |
          npx wrangler@3 d1 execute ai-news-hub-db --file=migrations/0001_initial.sql --remote
          npx wrangler@3 d1 execute ai-news-hub-db --file=migrations/0002_add_country.sql --remote || true
          npx wrangler@3 d1 execute ai-news-hub-db --file=migrations/0003_family_trees.sql --remote || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build site
        run: npx astro build

      - name: Build search index
        run: npx pagefind --site dist

      - name: Create Cloudflare Pages project (if not exists)
        run: |
          npx wrangler@3 pages project create ai-news-hub --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=ai-news-hub
